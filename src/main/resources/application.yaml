server:
  port: 8080

app:
  name: To-Do List API
  version: 2.0.0
  upload:
    dir: uploads

spring:
  profiles:
    default: local
  config:
    import: optional:file:.env[.properties]
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mvc:
    throw-exception-if-no-handler-found: true
  jpa:
    open-in-view: false
  flyway:
    enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
