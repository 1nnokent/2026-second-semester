server:
  port: 0

app:
  name: To-Do List API [TEST]
  version: 2.0.0
  upload:
    dir: target/test-uploads

spring:
  datasource:
    url: jdbc:h2:mem:todo-db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

logging:
  level:
    root: WARN
    com.example.demo: DEBUG
